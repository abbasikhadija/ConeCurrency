name: Ubuntu integrated application
on: [push, pull_request]
jobs:
  integrated:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu dependencies and record environment
        run: |
          bash scripts/setup_ubuntu.sh
          cat /etc/os-release
          gcc --version
          python3 --version
      - name: Build the separate optional unsafe demonstration
        run: make unsafe
      - name: Demonstrate all original scenarios without hanging
        run: timeout 60 bash scripts/demo.sh all
      - name: Retain the optional unsafe race demonstration
        run: python3 tests/test_race.py --demo
      - name: Measure and plot the real integrated server
        run: |
          bash scripts/run_benchmarks.sh
          for summary in benchmarks/results/*/summary.csv; do
            python3 tools/plot_benchmarks.py "$summary"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-benchmarks-${{ matrix.os }}
          path: benchmarks/results/
  thread-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enable compatible sanitizer address layout
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Full application under ThreadSanitizer
        run: |
          make all CFLAGS='-std=c11 -Wall -Wextra -Werror -O1 -g -fsanitize=thread'
          python3 tests/test_race.py
          SANITIZER_THREADS=1 P3_TEST_SERVER=./ticket-server python3 -m unittest discover -s tests -p 'test_concurrent.py' -v
